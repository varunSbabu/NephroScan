services:
  - type: web
    name: nephroscan
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir Frontend app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.2"
      - key: SECRET_KEY
        generateValue: true
